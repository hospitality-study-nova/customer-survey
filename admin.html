<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Customer Survey | Team</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%233b4b56%27/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--bg:#fff;--panel:#f4f5f7;--ink:#12151a;--muted:#5f6673;--line:#e1e4e9;--accent:#3b4b56;--accent-soft:#e8edf0;--ok:#2f6b4f;--bad:#a63d3d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.bar{display:flex;align-items:center;gap:10px;padding:12px 0;flex-wrap:wrap}
.bar h1{font-size:1.05rem;margin:0;letter-spacing:-.01em;flex:1;min-width:150px}
.bar h1 small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:.88rem}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:5px 12px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:default}
nav.tabs{display:flex;gap:4px;overflow:auto}
nav.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-color:var(--accent)}
main{padding:22px 0 80px}
h2{font-size:1.15rem;margin:30px 0 10px;letter-spacing:-.01em}
h2:first-child{margin-top:0}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:#fff}
.kpi b{display:block;font-size:1.7rem;letter-spacing:-.02em;line-height:1.1}
.kpi span{color:var(--muted);font-size:.82rem}
.cards{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}
.card h3{margin:0 0 10px;font-size:.92rem}
.card .note{color:var(--muted);font-size:.8rem;margin:-4px 0 10px}
.row{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;margin:6px 0;font-size:.86rem}
.row .l{overflow:hidden;text-overflow:ellipsis}
.row .t{height:10px;border-radius:99px;background:var(--panel);overflow:hidden}
.row .t i{display:block;height:100%;background:var(--accent);border-radius:99px}
.row .v{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.ok .t i{background:var(--ok)}
.empty{color:var(--muted);font-size:.86rem}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
select,input[type=text],input[type=email],input[type=password],input[type=search],textarea{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;width:100%}
select{width:auto;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}
tr.click{cursor:pointer}tr.click:hover{background:var(--panel)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:16px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--panel);font-size:.74rem;font-weight:700;color:var(--muted)}
.tag.warn{background:#f6e8e8;color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(18,21,26,.45);display:flex;justify-content:center;align-items:flex-start;padding:30px 12px;overflow:auto;z-index:30}
.sheet{background:#fff;border-radius:20px;max-width:640px;width:100%;padding:22px}
.sheet h3{margin:0 0 4px}
.kv{display:grid;grid-template-columns:160px 1fr;gap:6px 14px;margin:14px 0;font-size:.88rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.kv ol{margin:0;padding-left:20px}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.login .card{padding:22px}
.login label{display:block;font-weight:700;font-size:.85rem;margin:12px 0 6px}
.msg{margin:12px 0 0;font-size:.86rem;color:var(--muted)}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.trow{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:#fff}
.trow .o{color:var(--muted);font-size:.78rem;margin:0 0 8px}
.trow .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trow label{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.trow textarea{min-height:56px;resize:vertical;margin-top:4px}
.trow .act{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:.8rem;color:var(--muted)}
.trow.edited{border-color:var(--accent)}
@media(max-width:640px){.trow .two{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.row{grid-template-columns:minmax(80px,42%) 1fr auto}}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
(function(){
"use strict";
var C=window.SITE_CONFIG||{};
var QUOTA=30;
var PLACES=["Albufeira","Lagos","Vilamoura","Tróia","Aroeira","Castro Marim"];
var OTHER="Other places";
var app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function qs(sel,el){return (el||document).querySelector(sel);}
if(!C.SUPABASE_URL||!C.SUPABASE_ANON_KEY||!window.supabase){
  app.innerHTML='<div class="login"><div class="card"><h3>Falta configurar</h3><p class="msg">Preencha SUPABASE_URL e SUPABASE_ANON_KEY no ficheiro config.js (ver LEIA-ME.md).</p></div></div>';return;
}
var sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
var ST={tab:"overview",rows:[],filter:"all",user:null,texts:null,unlocked:false,ovr:{},tq:"",tshow:30,detail:null,loaded:false,err:null};

/* ---------- link do questionario ---------- */
function formUrl(){return C.SITE_URL||new URL("./",location.href).href;}
function shareMsg(){return "Estudo de estudantes da Nova SBE sobre férias e lazer em Portugal. Demora cerca de 5 minutos e é anónimo: "+formUrl();}
function copyText(t,btn){
  function ok(){if(btn){var o=btn.textContent;btn.textContent="Copiado";setTimeout(function(){btn.textContent=o;},1600);}}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,function(){});return;}
  var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok();}catch(e){}document.body.removeChild(ta);
}

/* ---------- login ---------- */
function loginView(msg,cls){
  app.innerHTML='<div class="login"><div class="card"><h3 style="font-size:1.2rem">Customer Survey | Equipa</h3><p class="msg" style="margin-top:4px">Área privada. Entre com o email da equipa.</p>'+
   '<label for="em">Email</label><input type="email" id="em" autocomplete="username">'+
   '<label for="pw">Palavra-passe</label><input type="password" id="pw" autocomplete="current-password">'+
   '<div style="display:flex;gap:10px;margin-top:16px"><button class="btn pri" id="go" style="flex:1">Entrar</button><button class="btn" id="ml">Enviar link por email</button></div>'+
   '<p class="msg '+(cls||'')+'" id="lm">'+esc(msg||"")+'</p></div></div>';
  function val(i){return qs("#"+i).value.trim();}
  qs("#go").onclick=function(){
    sb.auth.signInWithPassword({email:val("em"),password:qs("#pw").value}).then(function(r){
      if(r.error){qs("#lm").textContent="Email ou palavra-passe incorretos.";qs("#lm").className="msg bad";}else boot();});
  };
  qs("#pw").addEventListener("keydown",function(e){if(e.key==="Enter")qs("#go").click();});
  qs("#ml").onclick=function(){
    if(!val("em")){qs("#lm").textContent="Escreva o seu email primeiro.";qs("#lm").className="msg bad";return;}
    sb.auth.signInWithOtp({email:val("em"),options:{shouldCreateUser:false,emailRedirectTo:location.href.split("#")[0]}}).then(function(r){
      qs("#lm").textContent=r.error?"Não foi possível enviar. Confirme o email.":"Enviámos um link para o seu email.";qs("#lm").className="msg "+(r.error?"bad":"ok");});
  };
}

/* ---------- arranque ---------- */
function boot(){
  sb.auth.getSession().then(function(r){
    var s=r.data&&r.data.session;
    if(!s){loginView();return;}
    ST.user=s.user;
    sb.rpc("is_team").then(function(t){
      if(t.error||t.data!==true){app.innerHTML='<div class="login"><div class="card"><h3>Sem acesso</h3><p class="msg bad">Esta conta ('+esc(s.user.email)+') não está na lista da equipa.</p><button class="btn" id="so" style="margin-top:12px">Sair</button></div></div>';qs("#so").onclick=function(){sb.auth.signOut().then(function(){loginView();});};return;}
      shell();loadRows();
    });
  });
}
sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_IN"&&!ST.user)boot();});

function shell(){
  app.innerHTML='<header class="top"><div class="wrap"><div class="bar"><h1>Customer Survey<small>Área privada da equipa</small></h1>'+
   '<button class="btn pri sm" id="clink">Copiar link do questionário</button><button class="btn sm" id="shr">Partilhar</button><a class="btn sm" id="opn" href="'+esc(formUrl())+'" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Abrir</a><button class="btn sm" id="out">Sair</button></div>'+
   '<nav class="tabs"><button data-t="overview">Visão geral</button><button data-t="responses">Respostas</button><button data-t="texts">Textos</button></nav></div></header><main><div class="wrap" id="view"></div></main><div id="mod"></div>';
  qs("#clink").onclick=function(){copyText(formUrl(),this);};
  qs("#shr").onclick=function(){
    if(navigator.share){navigator.share({title:"Holiday & leisure in Portugal",text:shareMsg()}).catch(function(){});}
    else window.open("https://wa.me/?text="+encodeURIComponent(shareMsg()),"_blank");
  };
  qs("#out").onclick=function(){sb.auth.signOut().then(function(){ST.user=null;ST.loaded=false;loginView();});};
  Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"),function(b){b.onclick=function(){ST.tab=b.getAttribute("data-t");if(ST.tab!=="texts")ST.unlocked=false;paint();};});
  paint();
}
function paint(){
  Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"),function(b){b.classList.toggle("on",b.getAttribute("data-t")===ST.tab);});
  var v=qs("#view");
  if(ST.err){v.innerHTML='<p class="msg bad">'+esc(ST.err)+'</p>';return;}
  if(ST.tab==="texts"){textsView(v);return;}
  if(!ST.loaded){v.innerHTML='<p class="msg">A carregar...</p>';return;}
  if(ST.tab==="responses")responsesView(v);else overviewView(v);
}

/* ---------- dados ---------- */
function loadRows(){
  var all=[];
  function page(from){
    sb.from("responses").select("session_id,created_at,updated_at,destination,payload").order("created_at",{ascending:false}).range(from,from+999).then(function(r){
      if(r.error){ST.err="Erro ao ler respostas: "+r.error.message;paint();return;}
      all=all.concat(r.data);
      if(r.data.length===1000)page(from+1000);else{ST.rows=all;ST.loaded=true;paint();}
    });
  }
  page(0);
}
function P(r){return r.payload||{};}
function isScreened(r){return !!P(r).screened_out;}
function placeOf(r){var p=P(r);return p.in_target_place&&p.destination?p.destination:OTHER;}
function complete(){return ST.rows.filter(function(r){return !isScreened(r);});}
function filtered(){
  var c=complete();
  if(ST.filter==="all")return c;
  return c.filter(function(r){return placeOf(r)===ST.filter;});
}

/* ---------- graficos simples ---------- */
function pct(n,t){return t?Math.round(n/t*100):0;}
function bars(title,counts,total,opts){
  opts=opts||{};
  var h='<div class="card"><h3>'+esc(title)+'</h3>'+(opts.note?'<p class="note">'+esc(opts.note)+'</p>':'');
  if(!counts.length||!total){return h+'<p class="empty">Sem dados.</p></div>';}
  var max=Math.max.apply(null,counts.map(function(c){return c[1];}))||1;
  counts.forEach(function(c){h+='<div class="row"><span class="l" title="'+esc(c[0])+'">'+esc(c[0])+'</span><span class="t"><i style="width:'+Math.round(c[1]/max*100)+'%"></i></span><span class="v">'+c[1]+' ('+pct(c[1],total)+'%)</span></div>';});
  return h+'</div>';
}
function tally(rows,get,order){
  var m={};rows.forEach(function(r){var v=get(r);if(v==null||v==="")return;(Array.isArray(v)?v:[v]).forEach(function(x){m[x]=(m[x]||0)+1;});});
  var keys=Object.keys(m);
  if(order){keys.sort(function(a,b){var ia=order.indexOf(a),ib=order.indexOf(b);if(ia<0)ia=99;if(ib<0)ib=99;return ia-ib||m[b]-m[a];});}
  else keys.sort(function(a,b){return m[b]-m[a];});
  return keys.map(function(k){return [k,m[k]];});
}
function money(s){var m=String(s).match(/\d+/);return m?+m[0]:(/not/i.test(s)?9999:0);}
function ranks(title,rows,get,note){
  var sum={},n={},first={},cnt=0;
  rows.forEach(function(r){var a=get(r);if(!a||!a.length)return;cnt++;a.forEach(function(x,i){sum[x]=(sum[x]||0)+i+1;n[x]=(n[x]||0)+1;if(i===0)first[x]=(first[x]||0)+1;});});
  var keys=Object.keys(sum).sort(function(a,b){return sum[a]/n[a]-sum[b]/n[b];});
  var h='<div class="card"><h3>'+esc(title)+'</h3><p class="note">'+esc(note||"Posição média (1 é a melhor) e % que a pôs em 1.º lugar.")+'</p>';
  if(!cnt)return h+'<p class="empty">Sem dados.</p></div>';
  var L=keys.length;
  keys.forEach(function(k){var avg=sum[k]/n[k];var w=L>1?Math.round((L-avg)/(L-1)*100):100;
    h+='<div class="row"><span class="l" title="'+esc(k)+'">'+esc(k)+'</span><span class="t"><i style="width:'+Math.max(w,3)+'%"></i></span><span class="v">'+avg.toFixed(1)+' · '+pct(first[k]||0,cnt)+'% em 1.º</span></div>';});
  return h+'</div>';
}

/* ---------- visao geral ---------- */
var AGE=["18 to 24","25 to 34","35 to 44","45 to 54","55 to 64","65 or older"];
var GENDER=["Male","Female","Non binary","Prefer not to say"];
var FREQ=["More than once a year","Once a year","Every two years","Every three years or less","This was my first time"];
var NIGHTS=["1 night","2 to 3 nights","4 to 7 nights","8 to 14 nights","15 nights or more"];
function overviewView(v){
  var all=complete(),rows=filtered(),T=rows.length;
  var screened=ST.rows.length-all.length;
  var inT=all.filter(function(r){return P(r).in_target_place;}).length;
  var dur=all.map(function(r){return P(r).duration_s;}).filter(function(x){return x>0;}).sort(function(a,b){return a-b;});
  var med=dur.length?Math.round(dur[Math.floor(dur.length/2)]/60*10)/10:"n/d";
  var h='<h2>Respostas</h2><div class="grid kpis">'+
   kpi(all.length,"respostas completas")+kpi(inT,"nos 6 destinos")+kpi(all.length-inT,"noutros locais")+kpi(screened,"excluídas (sem férias)")+kpi(med,"minutos (mediana)")+'</div>';
  h+='<h2>Objetivo por destino</h2><div class="card">'+'<p class="note">Meta: '+QUOTA+' respostas por destino.</p>';
  PLACES.forEach(function(p){var n=all.filter(function(r){return placeOf(r)===p;}).length;
    h+='<div class="row'+(n>=QUOTA?' ok':'')+'"><span class="l">'+esc(p)+'</span><span class="t"><i style="width:'+Math.min(100,pct(n,QUOTA))+'%"></i></span><span class="v">'+n+' / '+QUOTA+'</span></div>';});
  h+='</div>';
  h+='<h2>Análise</h2><div class="filters"><label for="flt" style="font-weight:700">Filtrar:</label><select id="flt"><option value="all">Todos ('+all.length+')</option>'+
    PLACES.concat([OTHER]).map(function(p){return '<option value="'+esc(p)+'"'+(ST.filter===p?' selected':'')+'>'+esc(p==OTHER?"Outros locais (não destino)":p)+' ('+all.filter(function(r){return placeOf(r)===p;}).length+')</option>';}).join("")+'</select><span class="tag">'+T+' respostas</span></div>';
  h+='<div class="grid cards">'+
   bars("Destino",tally(rows,function(r){return placeOf(r);},PLACES.concat([OTHER])),T)+
   bars("Género",tally(rows,function(r){return P(r).gender;},GENDER),T)+
   bars("Idade",tally(rows,function(r){return P(r).age;},AGE),T)+
   bars("Residência",tally(rows,function(r){return P(r).residence;}),T)+
   bars("Programas de fidelização que tem",tally(rows,function(r){return P(r).loyalty_memberships;}),T,{note:"Cada pessoa pode escolher vários."})+
   bars("Língua do questionário",tally(rows,function(r){return P(r).language==="pt"?"Português":"English";}),T)+
   '</div>';
  h+='<h2>Férias</h2><div class="grid cards">'+
   bars("Frequência",tally(rows,function(r){return P(r).frequency;},FREQ),T)+
   bars("Noites na última visita",tally(rows,function(r){return P(r).nights_last_visit;},NIGHTS),T)+
   bars("Com quem viajou",tally(rows,function(r){return P(r).travelled_with_last_visit;}),T)+
   bars("Motivo principal da visita",tally(rows,function(r){return P(r).entry_point;}),T)+
   ranks("O que mais importou (ranking)",rows,function(r){return P(r).vertical_rank;})+
   '</div>';
  h+='<h2>Programa de fidelização</h2><div class="grid cards">'+
   ranks("Mecanismos (ranking)",rows,function(r){return P(r).mechanism_rank;})+
   ranks("Benefícios (ranking)",rows,function(r){return P(r).benefit_rank;})+
   bars("Bundle: como entra",tally(rows,function(r){return (P(r).program_built||{}).enter;}),T)+
   bars("Bundle: como acumula",tally(rows,function(r){return (P(r).program_built||{}).earn;}),T)+
   bars("Bundle: como sobe de nível",tally(rows,function(r){return (P(r).program_built||{}).level_up;}),T)+
   bars("Bundle: benefícios escolhidos",tally(rows,function(r){return (P(r).program_built||{}).benefits;}),T,{note:"Até 3 por pessoa."})+
   bars("Grátis ou pago",tally(rows,function(r){return P(r).program_type;}),T)+
   bars("Preço anual aceitável",tally(rows,function(r){return P(r).fee_band;}),T)+
   bars("Atividades",tally(rows,function(r){return P(r).cross_use;}),T)+
   bars("Alcance geográfico",tally(rows,function(r){return P(r).geo_reach;}),T)+
   '</div>';
  h+='<h2>Orçamento</h2><div class="grid cards">'+
   bars("Quarto de hotel (2 pessoas, pequeno-almoço), por noite",tally(rows,function(r){return P(r).wtp_hotel_room_two_breakfast;}).sort(function(a,b){return money(a[0])-money(b[0]);}),T)+
   bars("Jantar por pessoa, bebidas incluídas",tally(rows,function(r){return P(r).wtp_dinner_pp_drinks;}).sort(function(a,b){return money(a[0])-money(b[0]);}),T)+
   '</div>';
  v.innerHTML=h;
  qs("#flt").onchange=function(){ST.filter=this.value;paint();};
}
function kpi(n,l){return '<div class="kpi"><b>'+esc(n)+'</b><span>'+esc(l)+'</span></div>';}

/* ---------- respostas ---------- */
function fmtDate(s){var d=new Date(s);return d.toLocaleDateString("pt-PT")+" "+d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});}
function responsesView(v){
  var rows=ST.rows.filter(function(r){return ST.filter==="all"||placeOf(r)===ST.filter;});
  var h='<h2>Respostas uma a uma</h2><div class="filters"><select id="flt"><option value="all">Todos os destinos</option>'+PLACES.concat([OTHER]).map(function(p){return '<option value="'+esc(p)+'"'+(ST.filter===p?' selected':'')+'>'+esc(p==OTHER?"Outros locais":p)+'</option>';}).join("")+'</select><span class="tag">'+rows.length+' registos</span><span style="flex:1"></span><button class="btn sm" id="csv">Exportar CSV</button></div>';
  h+='<div class="tablewrap"><table><thead><tr><th>Data</th><th>Local</th><th>Género</th><th>Idade</th><th>Língua</th><th>Min.</th><th></th></tr></thead><tbody>';
  rows.forEach(function(r,i){var p=P(r);
    h+='<tr class="click" data-i="'+i+'"><td>'+esc(fmtDate(r.created_at))+'</td><td>'+esc(p.in_target_place?p.destination:(p.other_destination||"Outro"))+'</td><td>'+esc(p.gender||"")+'</td><td>'+esc(p.age||"")+'</td><td>'+esc((p.language||"").toUpperCase())+'</td><td>'+(p.duration_s?Math.round(p.duration_s/60*10)/10:"")+'</td><td>'+(isScreened(r)?'<span class="tag warn">excluída</span>':'')+'</td></tr>';});
  if(!rows.length)h+='<tr><td colspan="7" class="empty">Ainda não há respostas.</td></tr>';
  h+='</tbody></table></div>';
  v.innerHTML=h;
  qs("#flt").onchange=function(){ST.filter=this.value;paint();};
  qs("#csv").onclick=function(){exportCsv(rows);};
  Array.prototype.forEach.call(v.querySelectorAll("tr.click"),function(tr){tr.onclick=function(){detail(rows[+tr.getAttribute("data-i")]);};});
}
function detail(r){
  var p=P(r),b=p.program_built||{};
  function ol(a){return a&&a.length?'<ol>'+a.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ol>':"";}
  function kv(k,val){return val==null||val===""||(Array.isArray(val)&&!val.length)?"":'<dt>'+esc(k)+'</dt><dd>'+val+'</dd>';}
  var h='<div class="modal" id="dm"><div class="sheet"><div style="display:flex;justify-content:space-between;gap:10px"><div><h3>'+esc(p.in_target_place?p.destination:(p.other_destination||"Outro local"))+'</h3><span class="tag">'+esc(fmtDate(r.created_at))+'</span></div><button class="btn sm" id="dx">Fechar</button></div>'+
   (isScreened(r)?'<p class="msg bad">Excluída: '+esc(p.screened_out)+'</p>':'')+
   '<dl class="kv">'+kv("Género",esc(p.gender))+kv("Idade",esc(p.age))+kv("Residência",esc(p.residence))+kv("Fidelização",esc((p.loyalty_memberships||[]).join(", ")))+
   kv("Frequência",esc(p.frequency))+kv("Última visita",esc(p.nights_last_visit))+kv("Com quem",esc(p.travelled_with_last_visit))+kv("Motivo principal",esc(p.entry_point)+(p.entry_point_other?": "+esc(p.entry_point_other):""))+
   kv("O que importou",ol(p.vertical_rank))+kv("Mecanismos",ol(p.mechanism_rank))+kv("Benefícios",ol(p.benefit_rank))+
   kv("Bundle: entrar",esc(b.enter))+kv("Bundle: acumular",esc(b.earn))+kv("Bundle: subir",esc(b.level_up))+kv("Bundle: benefícios",ol(b.benefits))+
   kv("Grátis ou pago",esc(p.program_type))+kv("Preço anual",esc(p.fee_band))+kv("Atividades",esc(p.cross_use))+kv("Alcance",esc(p.geo_reach))+
   kv("Quarto por noite",esc(p.wtp_hotel_room_two_breakfast))+kv("Jantar por pessoa",esc(p.wtp_dinner_pp_drinks))+kv("Nas suas palavras",esc(p.open_anything_missing))+
   kv("Língua",esc(p.language))+kv("Duração (s)",esc(p.duration_s))+kv("Versão",esc(p.version))+'</dl>'+
   '<div style="display:flex;justify-content:flex-end"><button class="btn sm" id="ddel" style="color:var(--bad)">Apagar esta resposta</button></div></div></div>';
  qs("#mod").innerHTML=h;
  qs("#dx").onclick=function(){qs("#mod").innerHTML="";};
  qs("#dm").onclick=function(e){if(e.target.id==="dm")qs("#mod").innerHTML="";};
  qs("#ddel").onclick=function(){
    if(!window.confirm("Apagar esta resposta para sempre?"))return;
    sb.from("responses").delete().eq("session_id",r.session_id).then(function(x){
      if(x.error){window.alert("Não foi possível apagar: "+x.error.message);return;}
      ST.rows=ST.rows.filter(function(y){return y.session_id!==r.session_id;});qs("#mod").innerHTML="";paint();});
  };
}
function exportCsv(rows){
  var cols=["created_at","session_id","language","gender","age","residence","destination","other_destination","in_target_place","screened_out","frequency","nights_last_visit","travelled_with_last_visit","entry_point","entry_point_other","vertical_rank","mechanism_rank","benefit_rank","program_type","fee_band","cross_use","geo_reach","built_enter","built_earn","built_level_up","built_benefits","loyalty_memberships","wtp_hotel_room_two_breakfast","wtp_dinner_pp_drinks","open_anything_missing","duration_s"];
  function cell(x){if(x==null)return "";if(Array.isArray(x))x=x.join(" > ");x=String(x).replace(/"/g,'""');return /[;"\n\r]/.test(x)?'"'+x+'"':x;}
  var lines=[cols.join(";")];
  rows.forEach(function(r){var p=P(r),b=p.program_built||{};
    var m={created_at:r.created_at,session_id:r.session_id,built_enter:b.enter,built_earn:b.earn,built_level_up:b.level_up,built_benefits:b.benefits};
    lines.push(cols.map(function(c){return cell(c in m?m[c]:p[c]);}).join(";"));});
  var blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="holiday-study-"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();document.body.removeChild(a);
}

/* ---------- textos ---------- */
function loadTexts(cb){
  var n=0,done=function(){if(++n===2){cb();}};
  fetch("texts.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(j){ST.texts=j;done();}).catch(function(){ST.err="Não foi possível ler texts.json.";done();});
  sb.from("text_overrides").select("lang,key,value").then(function(r){ST.ovr={};(r.data||[]).forEach(function(o){ST.ovr[o.lang+"|"+o.key]=o.value;});if(r.error)ST.err="Erro ao ler textos: "+r.error.message;done();});
}
function textsView(v){
  if(!ST.texts){v.innerHTML='<p class="msg">A carregar...</p>';loadTexts(function(){paint();});return;}
  var keys=Object.keys(ST.texts);
  var q=ST.tq.toLowerCase();
  var list=keys.filter(function(k){if(!q)return true;return k.toLowerCase().indexOf(q)>-1||String(ST.texts[k]).toLowerCase().indexOf(q)>-1||(ST.ovr["en|"+k]||"").toLowerCase().indexOf(q)>-1||(ST.ovr["pt|"+k]||"").toLowerCase().indexOf(q)>-1;});
  var h='<h2>Editar textos</h2><p class="msg" style="margin-top:-4px">Só para pequenas correções de linguagem (gralhas, definições, exemplos). Não acrescenta nem tira perguntas. As respostas já guardadas não são afetadas: guardam sempre o nome original de cada opção. As alterações aparecem no questionário em poucos segundos.</p>'+
   '<div class="filters"><input type="search" id="tq" placeholder="Pesquisar texto..." value="'+esc(ST.tq)+'" style="max-width:380px"><span class="tag">'+list.length+' textos</span>'+(ST.unlocked?'<button class="btn sm" id="lockb">Bloquear</button>':'<button class="btn sm pri" id="editb">Editar</button><span class="tag">🔒 bloqueado (só leitura)</span>')+'</div>'+
   (ST.unlocked||!ST.askpw?'':'<div class="card" style="padding:14px;margin:10px 0"><label for="epw" style="font-weight:700;font-size:.85rem">Confirme a sua palavra-passe para editar</label><div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"><input type="password" id="epw" autocomplete="current-password" style="max-width:260px"><button class="btn sm pri" id="epwok">Desbloquear</button><button class="btn sm" id="epwno">Cancelar</button></div><p class="msg bad" id="epwmsg"></p></div>');
  list.slice(0,ST.tshow).forEach(function(k,i){
    var en=ST.ovr["en|"+k]!=null?ST.ovr["en|"+k]:k, pt=ST.ovr["pt|"+k]!=null?ST.ovr["pt|"+k]:ST.texts[k];
    var ed=ST.ovr["en|"+k]!=null||ST.ovr["pt|"+k]!=null;
    h+='<div class="trow'+(ed?' edited':'')+'" data-k="'+esc(k)+'"><p class="o">Original: '+esc(k.length>140?k.slice(0,140)+"...":k)+'</p><div class="two"><div><label>English</label><textarea data-l="en"'+(ST.unlocked?'':' readonly')+'>'+esc(en)+'</textarea></div><div><label>Português</label><textarea data-l="pt"'+(ST.unlocked?'':' readonly')+'>'+esc(pt)+'</textarea></div></div>'+(ST.unlocked?'<div class="act"><button class="btn sm pri" data-save="1">Guardar</button><button class="btn sm" data-reset="1">Repor original</button><span class="st">'+(ed?"editado":"")+'</span></div>':'<div class="act"><span class="st">'+(ed?"editado":"")+'</span></div>')+'</div>';});
  if(list.length>ST.tshow)h+='<p style="text-align:center"><button class="btn" id="more">Mostrar mais</button></p>';
  v.innerHTML=h;
  var tq=qs("#tq");tq.oninput=function(){ST.tq=this.value;ST.tshow=30;var pos=this.selectionStart;paint();var t2=qs("#tq");t2.focus();t2.setSelectionRange(pos,pos);};
  var eb=qs("#editb");if(eb)eb.onclick=function(){ST.askpw=true;paint();var e=qs("#epw");if(e)e.focus();};
  var lb=qs("#lockb");if(lb)lb.onclick=function(){ST.unlocked=false;ST.askpw=false;paint();};
  var no=qs("#epwno");if(no)no.onclick=function(){ST.askpw=false;paint();};
  var ok=qs("#epwok");if(ok){var go=function(){
    var m=qs("#epwmsg");m.textContent="A verificar...";
    sb.auth.signInWithPassword({email:ST.user.email,password:qs("#epw").value}).then(function(r){
      if(r.error){m.textContent="Palavra-passe incorreta.";return;}
      ST.unlocked=true;ST.askpw=false;paint();});};
    ok.onclick=go;qs("#epw").onkeydown=function(e){if(e.key==="Enter")go();};}
  var more=qs("#more");if(more)more.onclick=function(){ST.tshow+=30;paint();};
  Array.prototype.forEach.call(v.querySelectorAll(".trow"),function(row){
    if(!ST.unlocked)return;
    var k=row.getAttribute("data-k"),st=qs(".st",row);
    qs("[data-save]",row).onclick=function(){saveRow(row,k,st);};
    qs("[data-reset]",row).onclick=function(){
      qs('[data-l="en"]',row).value=k;qs('[data-l="pt"]',row).value=ST.texts[k];saveRow(row,k,st);};
  });
}
function saveRow(row,k,st){
  var ops=[],who=(ST.user&&ST.user.email)||"";
  [["en",k],["pt",ST.texts[k]]].forEach(function(p){
    var val=qs('[data-l="'+p[0]+'"]',row).value.trim(),def=p[1],id=p[0]+"|"+k;
    if(!val||val===def){if(ST.ovr[id]!=null){ops.push(sb.from("text_overrides").delete().eq("lang",p[0]).eq("key",k).then(function(r){if(!r.error)delete ST.ovr[id];return r;}));}}
    else if(ST.ovr[id]!==val){ops.push(sb.from("text_overrides").upsert({lang:p[0],key:k,value:val,updated_by:who,updated_at:new Date().toISOString()}).then(function(r){if(!r.error)ST.ovr[id]=val;return r;}));}
  });
  st.textContent="a guardar...";
  Promise.all(ops).then(function(rs){
    var bad=rs.filter(function(r){return r&&r.error;})[0];
    st.textContent=bad?"erro: "+bad.error.message:(ST.ovr["en|"+k]!=null||ST.ovr["pt|"+k]!=null?"guardado":"original");
    row.classList.toggle("edited",ST.ovr["en|"+k]!=null||ST.ovr["pt|"+k]!=null);
  });
}

boot();
})();
</script>
</body>
</html>
