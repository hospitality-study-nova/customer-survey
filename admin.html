<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Customer Survey | Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%233b4b56%27/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--bg:#fff;--panel:#f4f5f7;--ink:#12151a;--muted:#5f6673;--line:#e1e4e9;--accent:#3b4b56;--accent-soft:#e8edf0;--ok:#2f6b4f;--bad:#a63d3d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1840px;margin:0 auto;padding:0 clamp(16px,3vw,48px)}
header.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.bar{display:flex;align-items:center;gap:10px;padding:12px 0;flex-wrap:wrap}
.bar h1{font-size:1.05rem;margin:0;letter-spacing:-.01em;flex:1;min-width:150px}
.bar h1 small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:.88rem}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:5px 12px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:default}
nav.tabs{display:flex;gap:4px;overflow:auto}
nav.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-color:var(--accent)}
main{padding:22px 0 80px}
h2{font-size:1.15rem;margin:30px 0 10px;letter-spacing:-.01em}
h2:first-child{margin-top:0}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.kpi{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:#fff}
.kpi b{display:block;font-size:1.7rem;letter-spacing:-.02em;line-height:1.1}
.kpi span{color:var(--muted);font-size:.82rem}
.cards{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}
.card h3{margin:0 0 10px;font-size:.92rem}
.card .note{color:var(--muted);font-size:.8rem;margin:-4px 0 10px}
.row{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;margin:6px 0;font-size:.86rem}
.row .l{overflow:hidden;text-overflow:ellipsis}
.row .t{height:10px;border-radius:99px;background:var(--panel);overflow:hidden}
.row .t i{display:block;height:100%;background:var(--accent);border-radius:99px}
.row .v{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.ok .t i{background:var(--ok)}
.empty{color:var(--muted);font-size:.86rem}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
select,input[type=text],input[type=email],input[type=password],input[type=search],textarea{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;width:100%}
select{width:auto;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}
tr.click{cursor:pointer}tr.click:hover{background:var(--panel)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:16px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--panel);font-size:.74rem;font-weight:700;color:var(--muted)}
.tag.warn{background:#f6e8e8;color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(18,21,26,.45);display:flex;justify-content:center;align-items:flex-start;padding:30px 12px;overflow:auto;z-index:30}
.sheet{background:#fff;border-radius:20px;max-width:640px;width:100%;padding:22px}
.sheet h3{margin:0 0 4px}
.kv{display:grid;grid-template-columns:160px 1fr;gap:6px 14px;margin:14px 0;font-size:.88rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.kv ol{margin:0;padding-left:20px}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.login .card{padding:22px}
.login label{display:block;font-weight:700;font-size:.85rem;margin:12px 0 6px}
.msg{margin:12px 0 0;font-size:.86rem;color:var(--muted)}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
@media(max-width:640px){.kv{grid-template-columns:1fr}.row{grid-template-columns:minmax(80px,42%) 1fr auto}}
.doc{max-width:860px}
.doc .card{margin:14px 0}
.doc ul{margin:8px 0 0;padding-left:20px}
.doc li{margin:7px 0;line-height:1.55}
.card.drill{cursor:pointer;transition:border-color .15s}
.card.drill:hover,.card.drill:focus-visible{border-color:var(--muted);outline:none}
.dh{font-weight:600;color:var(--muted);font-size:.72rem;margin-left:8px}
.sheet td small,.sheet th small{color:var(--muted);font-weight:500}
.sheet td{border-bottom:1px solid var(--line)}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"\25B8";display:inline-block;margin-right:6px;color:var(--muted)}
details[open]>summary::before{content:"\25BE"}
.card.pers{display:flex;flex-direction:column}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.ph h3{margin:0;font-size:1.05rem}
.tag{font-size:.72rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.voice{font-style:italic;color:var(--muted);font-size:.86rem;margin:2px 0 8px}
.pt{font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:14px 0 5px}
.ps{font-size:.84rem;line-height:1.6;margin:0}
.pl{display:flex;align-items:center;gap:8px;font-size:.86rem;padding:3px 0}.pl span:nth-child(2){flex:1}.pl.low{opacity:.65}
.pl .g{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;background:var(--line)}
.pw{font-size:.82rem}.pw td{padding:4px 6px 4px 0;vertical-align:top;border:0}
.pn{margin:0;padding-left:18px;font-size:.84rem;line-height:1.55}
.stl p{margin:4px 0;font-size:.88rem}.stl{margin:6px 0 10px}
.hyp{text-transform:none;letter-spacing:0;font-weight:500;font-style:italic}

.cc .cct{width:100%;border:0;border-bottom:1px dashed var(--line);font:700 .95rem inherit;padding:2px 0;margin-bottom:8px;background:none;color:inherit}
.cctb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0;font-size:.78rem}
.cctb select{font-size:.78rem;padding:3px 6px;border:1px solid var(--line);border-radius:8px;background:#fff}
.ccv{overflow:auto;background:repeating-conic-gradient(#f4f4f5 0% 25%,#fff 0% 50%) 50%/16px 16px;border-radius:8px}
.ccv svg{max-width:100%;height:auto;display:block}
.ccg{grid-template-columns:repeat(auto-fit,minmax(min(100%,620px),1fr))}
table.cmp th{text-align:left;vertical-align:top;font-size:.78rem}
table.cmp td{vertical-align:top;font-size:.8rem;min-width:150px}
table.cmp tr.sec th{background:#EFEFF1;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
details.sec{margin:14px 0}details.sec>summary{cursor:pointer;font-weight:700;font-size:1.05rem;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:12px}details.sec>summary small{color:var(--muted);font-weight:500}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
(function(){
"use strict";
var C=window.SITE_CONFIG||{};
var QUOTA=30;
var PLACES=["Albufeira","Lagos","Vilamoura","Tróia","Aroeira","Castro Marim"];
var OTHER="Other places";
var app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function qs(sel,el){return (el||document).querySelector(sel);}
if(!C.SUPABASE_URL||!C.SUPABASE_ANON_KEY||!window.supabase){
  app.innerHTML='<div class="login"><div class="card"><h3>Setup missing</h3><p class="msg">Fill in SUPABASE_URL and SUPABASE_ANON_KEY in config.js (see LEIA-ME.md).</p></div></div>';return;
}
var sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
var ST={tab:"overview",rows:[],filter:"all",user:null,detail:null,loaded:false,err:null};

/* ---------- questionnaire link ---------- */
function formUrl(){return C.SITE_URL||new URL("./",location.href).href;}
function shareMsg(){return "A Nova SBE student study on holidays in Portugal. It takes about 8 minutes and is anonymous: "+formUrl();}
function copyText(t,btn){
  function ok(){if(btn){var o=btn.textContent;btn.textContent="Copied";setTimeout(function(){btn.textContent=o;},1600);}}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,function(){});return;}
  var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok();}catch(e){}document.body.removeChild(ta);
}

/* ---------- login ---------- */
function loginView(msg,cls){
  app.innerHTML='<div class="login"><div class="card"><h3 style="font-size:1.2rem">Customer Survey | Team</h3><p class="msg" style="margin-top:4px">Private area. Sign in with your team email.</p>'+
   '<label for="em">Email</label><input type="email" id="em" autocomplete="username">'+
   '<label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password">'+
   '<div style="display:flex;gap:10px;margin-top:16px"><button class="btn pri" id="go" style="flex:1">Sign in</button><button class="btn" id="ml">Email me a link</button></div>'+
   '<p class="msg '+(cls||'')+'" id="lm">'+esc(msg||"")+'</p></div></div>';
  function val(i){return qs("#"+i).value.trim();}
  qs("#go").onclick=function(){
    sb.auth.signInWithPassword({email:val("em"),password:qs("#pw").value}).then(function(r){
      if(r.error){qs("#lm").textContent="Wrong email or password.";qs("#lm").className="msg bad";}else boot();});
  };
  qs("#pw").addEventListener("keydown",function(e){if(e.key==="Enter")qs("#go").click();});
  qs("#ml").onclick=function(){
    if(!val("em")){qs("#lm").textContent="Enter your email first.";qs("#lm").className="msg bad";return;}
    sb.auth.signInWithOtp({email:val("em"),options:{shouldCreateUser:false,emailRedirectTo:location.href.split("#")[0]}}).then(function(r){
      qs("#lm").textContent=r.error?"Could not send. Check the email.":"We sent a link to your email.";qs("#lm").className="msg "+(r.error?"bad":"ok");});
  };
}

/* ---------- boot ---------- */
function boot(){
  sb.auth.getSession().then(function(r){
    var s=r.data&&r.data.session;
    if(!s){loginView();return;}
    ST.user=s.user;
    sb.rpc("is_team").then(function(t){
      if(t.error||t.data!==true){app.innerHTML='<div class="login"><div class="card"><h3>No access</h3><p class="msg bad">This account ('+esc(s.user.email)+') is not on the team list.</p><button class="btn" id="so" style="margin-top:12px">Sign out</button></div></div>';qs("#so").onclick=function(){sb.auth.signOut().then(function(){loginView();});};return;}
      shell();loadRows();
    });
  });
}
sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_IN"&&!ST.user)boot();});

function shell(){
  app.innerHTML='<header class="top"><div class="wrap"><div class="bar"><h1>Customer Survey<small>Private team area</small></h1>'+
   '<button class="btn pri sm" id="clink">Copy questionnaire link</button><a class="btn sm" id="tst" href="'+esc(formUrl()+'?test=1')+'" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Test survey (nothing is saved)</a><button class="btn sm" id="out">Sign out</button></div>'+
   '<nav class="tabs"><button data-t="overview">Overview</button><button data-t="steering">Steering charts</button><button data-t="segments">Segments</button><button data-t="personas">Personas</button><button data-t="responses">Responses</button><button data-t="method">Methodology</button></nav></div></header><main><div class="wrap" id="view"></div></main><div id="mod"></div>';
  qs("#clink").onclick=function(){copyText(formUrl(),this);};
  qs("#out").onclick=function(){sb.auth.signOut().then(function(){ST.user=null;ST.loaded=false;loginView();});};
  Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"),function(b){b.onclick=function(){ST.tab=b.getAttribute("data-t");paint();};});
  paint();
}
function paint(){
  Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"),function(b){b.classList.toggle("on",b.getAttribute("data-t")===ST.tab);});
  var v=qs("#view");
  if(ST.err){v.innerHTML='<p class="msg bad">'+esc(ST.err)+'</p>';return;}
  if(ST.tab==="method"){methodView(v);return;}
  if(!ST.loaded){v.innerHTML='<p class="msg">A carregar...</p>';return;}
  if(ST.tab==="responses")responsesView(v);else if(ST.tab==="segments")segmentsView(v);else if(ST.tab==="personas")personasView(v);else if(ST.tab==="steering")steeringView(v);else overviewView(v);
}

/* ---------- dados ---------- */
function loadRows(){
  var all=[];
  function page(from){
    sb.from("responses").select("session_id,created_at,updated_at,destination,payload").order("created_at",{ascending:false}).range(from,from+999).then(function(r){
      if(r.error){ST.err="Error reading responses: "+r.error.message;paint();return;}
      all=all.concat(r.data);
      if(r.data.length===1000)page(from+1000);else{ST.rows=all;ST.loaded=true;paint();}
    });
  }
  page(0);
}
function P(r){return r.payload||{};}
function isScreened(r){return !!P(r).screened_out;}
function placeOf(r){var p=P(r);return p.in_target_place&&p.destination?p.destination:OTHER;}
function complete(){return ST.rows.filter(function(r){return !isScreened(r);});}
function filtered(){
  var c=complete();
  if(ST.filter==="all")return c;
  return c.filter(function(r){return placeOf(r)===ST.filter;});
}

/* ---------- graficos simples ---------- */
function pct(n,t){return t?Math.round(n/t*100):0;}
function bars(title,counts,total,opts){
  opts=opts||{};var di=-1;
  if(opts.drill){di=DR.length;DR.push({kind:"cat",title:title,get:opts.drill.get,order:opts.drill.order,label:opts.drill.label,extra:opts.drill.extra});}
  var h='<div class="card'+(di>-1?' drill':'')+'"'+(di>-1?' data-dr="'+di+'" tabindex="0" role="button"':'')+'><h3>'+esc(title)+(di>-1?'<span class="dh">by destination &rsaquo;</span>':'')+'</h3>'+(opts.note?'<p class="note">'+esc(opts.note)+'</p>':'');
  if(!counts.length||!total){return h+'<p class="empty">No data.</p></div>';}
  var max=Math.max.apply(null,counts.map(function(c){return c[1];}))||1;
  counts.forEach(function(c){h+='<div class="row"><span class="l" title="'+esc(c[0])+'">'+esc(c[0])+'</span><span class="t"><i style="width:'+Math.round(c[1]/max*100)+'%"></i></span><span class="v">'+c[1]+' ('+pct(c[1],total)+'%)</span></div>';});
  return h+'</div>';
}
function tally(rows,get,order){
  var m={};rows.forEach(function(r){var v=get(r);if(v==null||v==="")return;(Array.isArray(v)?v:[v]).forEach(function(x){m[x]=(m[x]||0)+1;});});
  var keys=Object.keys(m);
  if(order){keys.sort(function(a,b){var ia=order.indexOf(a),ib=order.indexOf(b);if(ia<0)ia=99;if(ib<0)ib=99;return ia-ib||m[b]-m[a];});}
  else keys.sort(function(a,b){return m[b]-m[a];});
  return keys.map(function(k){return [k,m[k]];});
}
var WTPQ=[
 {t:"Hotel, January (double room, 2 adults, breakfast), per night",f:"wtp_hotel_jan_double_two_breakfast",lab:["Up to €85","€86 to €110","€111 to €150","€151 to €210","More than €210"],pc:[25,55,76,89],n:124},
 {t:"Hotel, August (double room, 2 adults, breakfast), per night",f:"wtp_hotel_aug_double_two_breakfast",lab:["Up to €190","€191 to €260","€261 to €380","€381 to €540","More than €540"],pc:[25,48,75,90],n:99},
 {t:"Dinner per person, drinks included",f:"wtp_dinner_pp_drinks",lab:["Up to €16","€17 to €21","€22 to €27","€28 to €40","More than €40"],pc:[27,52,77,91],n:162}];
var TIERS=["Mass market","Mid","High","Premium","Luxury"];
function wtpTier(q,v){var i=q.lab.indexOf(v);return i<0?null:TIERS[i];}
function wtpPct(q,v){var i=q.lab.indexOf(v);if(i<0)return null;var e=[0].concat(q.pc,[100]);return (e[i]+e[i+1])/2;}
/* ---------- clique num cartao: ver por destino ---------- */
var DR=[];
function destCols(){return PLACES.concat([OTHER]);}
function valsOf(get,r){var v=get(r);if(v==null||v==="")return [];return Array.isArray(v)?v:[v];}
function heat(p){return 'background:rgba(59,75,86,'+(0.04+Math.min(1,Math.max(0,p))*0.5).toFixed(2)+')';}
function colHead(c,n){return '<th>'+esc(c===OTHER?"Other places":c)+'<br><small>n='+n+'</small></th>';}
function crossTable(d){
  var rows=complete(),cols=destCols(),g={};
  cols.forEach(function(c){g[c]=rows.filter(function(r){return placeOf(r)===c;});});
  function ans(rs){return rs.filter(function(r){return valsOf(d.get,r).length;});}
  var cats=tally(rows,d.get,d.order).map(function(c){return c[0];});
  if(d.extra)d.extra.forEach(function(x){if(cats.indexOf(x)<0)cats.push(x);});
  var h='<table><thead><tr><th>Answer</th>'+cols.map(function(c){return colHead(c,ans(g[c]).length);}).join("")+colHead("All",ans(rows).length)+'</tr></thead><tbody>';
  cats.forEach(function(k){
    function cell(rs){var a=ans(rs);var m=a.filter(function(r){return valsOf(d.get,r).indexOf(k)>-1;}).length;var p=a.length?m/a.length:0;
      return '<td style="'+heat(p)+'">'+(a.length?Math.round(p*100)+'% <small>('+m+')</small>':'-')+'</td>';}
    h+='<tr><td>'+esc(d.label?d.label(k):k)+'</td>'+cols.map(function(c){return cell(g[c]);}).join("")+cell(rows)+'</tr>';});
  return h+'</tbody></table>';
}
function rankMatrix(d){
  var rows=complete(),cols=destCols(),g={};
  cols.forEach(function(c){g[c]=rows.filter(function(r){return placeOf(r)===c;});});
  function calc(rs){var s={},n={},cnt=0,top=0;rs.forEach(function(r){var a=cleanRank(d.get(r));if(!a.length)return;cnt++;if(a.length>top)top=a.length;a.forEach(function(x,i){s[x]=(s[x]||0)+(a.length-i);n[x]=(n[x]||0)+1;});});return {s:s,n:n,cnt:cnt,top:top};}
  var all=calc(rows),per=cols.map(function(c){return calc(g[c]);});
  var keys=Object.keys(all.s).sort(function(a,b){return all.s[b]/all.n[b]-all.s[a]/all.n[a];});
  var h='<table><thead><tr><th>Item</th>'+cols.map(function(c,i){return colHead(c,per[i].cnt);}).join("")+colHead("All",all.cnt)+'</tr></thead><tbody>';
  var GOLD=["rgba(212,160,23,.62)","rgba(212,160,23,.40)","rgba(212,160,23,.22)"];
  function topOf(x){return Object.keys(x.s).sort(function(a,b){return x.s[b]/x.n[b]-x.s[a]/x.n[a];}).slice(0,3);}
  var tops=per.map(topOf),topAll=topOf(all);
  keys.forEach(function(k){
    function cell(x,t){if(!x.n[k])return '<td>-</td>';var pos=t.indexOf(k);var st=pos>-1?'background:'+GOLD[pos]+';font-weight:700':heat(x.s[k]/x.n[k]/x.top);return '<td style="'+st+'">'+(x.s[k]/x.n[k]).toFixed(1)+'</td>';}
    h+='<tr><td>'+esc(k)+'</td>'+per.map(function(x,i){return cell(x,tops[i]);}).join("")+cell(all,topAll)+'</tr>';});
  return h+'</tbody></table>';
}
function openDrill(i){
  var d=DR[i];if(!d)return;
  var note=d.kind==="rank"?"Average points by destination: 1st place gets as many points as there are items, last place gets 1. Gold marks the top 3 of each column (darkest gold = 1st); other cells: darker means higher.":"Share of the people at each destination who gave that answer (n is the number of people who answered). Darker means a larger share.";
  qs("#mod").innerHTML='<div class="modal" id="dm"><div class="sheet" style="max-width:1100px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><h3>'+esc(d.title)+' by destination</h3><p class="note" style="margin:4px 0 0;color:var(--muted);font-size:.82rem">'+esc(note)+'</p></div><button class="btn sm" id="dx">Close</button></div><div class="tablewrap" style="margin-top:12px">'+(d.kind==="rank"?rankMatrix(d):crossTable(d))+'</div></div></div>';
  qs("#dx").onclick=function(){qs("#mod").innerHTML="";};
  qs("#dm").onclick=function(e){if(e.target.id==="dm")qs("#mod").innerHTML="";};
}
function bindDrills(root){

function bundleCards(rows,T){
  var combos={},pairs={};

    var comp=[b.enter,b.earn,b.level_up].concat(b.benefits||[]).filter(Boolean);
    if(comp.length<2)return;
    var k=comp.join(" + ");combos[k]=(combos[k]||0)+1;
    for(var i=0;i<comp.length;i++)for(var j=i+1;j<comp.length;j++){var pk=comp[i]+" + "+comp[j];pairs[pk]=(pairs[pk]||0)+1;}});
  function top(m,n){return Object.keys(m).map(function(k){return [k,m[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,n);}
  return bars("Most common bundles (join + earn + level up + benefit)",top(combos,10),T,{note:"With few responses most bundles are unique. Use the pairs below to see what goes together."})+

function money(s){var m=String(s).match(/\d+/);return m?+m[0]:(/not/i.test(s)?9999:0);}
function ranks(title,rows,get,note){
  /* Points are the reverse of the position the respondent saw: first place gets as many points as there are items, last place gets 1.
     Own reasons typed in “Something else” are left out and the remaining items keep their relative order. */
  var di=DR.length;DR.push({kind:"rank",title:title,get:get});
  var sum={},n={},first={},cnt=0,top=0;
  rows.forEach(function(r){var raw=get(r)||[];var a=cleanRank(raw);if(!a.length)return;cnt++;if(a.length>top)top=a.length;
    a.forEach(function(x,i){sum[x]=(sum[x]||0)+(a.length-i);n[x]=(n[x]||0)+1;});
    if(String(raw[0]).indexOf("other: ")!==0)first[raw[0]]=(first[raw[0]]||0)+1;});
  var keys=Object.keys(sum).sort(function(a,b){return sum[b]/n[b]-sum[a]/n[a];});
  var h='<div class="card drill" data-dr="'+di+'" tabindex="0" role="button"><h3>'+esc(title)+'<span class="dh">by destination &rsaquo;</span></h3><p class="note">'+esc(note||"Average points: 1st place = "+(top||"N")+" points, last place = 1. Higher is better. Also the % who ranked it first.")+'</p>';
  if(!cnt)return h+'<p class="empty">No data.</p></div>';
  keys.forEach(function(k){var avg=sum[k]/n[k];var w=Math.round(avg/top*100);
    h+='<div class="row"><span class="l" title="'+esc(k)+'">'+esc(k)+'</span><span class="t"><i style="width:'+Math.max(w,3)+'%"></i></span><span class="v">'+avg.toFixed(1)+' pts · '+pct(first[k]||0,cnt)+'% ranked 1st</span></div>';});
  return h+'</div>';
}

function segRank(title,note,rows,get){
  var S=segCols(rows),cols=S.cols,g=S.g;
  function calc(rs){var s={},n={},cnt=0,top=0;rs.forEach(function(r){var a=cleanRank(get(r));if(!a.length)return;cnt++;if(a.length>top)top=a.length;a.forEach(function(x,i){s[x]=(s[x]||0)+(a.length-i);n[x]=(n[x]||0)+1;});});return {s:s,n:n,cnt:cnt,top:top};}
  var all=calc(rows),per=cols.map(function(c){return calc(g[c]);});
  var h='<div class="card" style="grid-column:1/-1"><h3>'+esc(title)+'</h3><p class="note">'+esc(note)+'</p>';
  if(!all.cnt)return h+'<p class="empty">No data.</p></div>';
  var keys=Object.keys(all.s).sort(function(a,b){return all.s[b]/all.n[b]-all.s[a]/all.n[a];});
  var GOLD=["rgba(212,160,23,.62)","rgba(212,160,23,.40)","rgba(212,160,23,.22)"];
  function topOf(x){return Object.keys(x.s).sort(function(a,b){return x.s[b]/x.n[b]-x.s[a]/x.n[a];}).slice(0,3);}

    h+='<tr><td>'+esc(k)+'</td>'+per.map(function(x,i){return cell(x,tops[i]);}).join("")+cell(all,topAll)+'</tr>';});
  return h+'</tbody></table></div></div>';
}

function rkScore(raw,item){var a=cleanRank(raw),i=a.indexOf(item);return(i<0||a.length<2)?null:(a.length-1-i)/(a.length-1);}
function outcomeList(rows){
  var L=[];function add(id,label,sec,scale,f){L.push({id:id,label:label,sec:sec,scale:scale,vals:rows.map(f)});}
  var pr={"Free, basic benefits":0,"Free, with an upgrade":1,"Paid, more and better benefits":2},gr={"Local":0,"Regional":1,"All of Portugal":2},cr={"One activity only":0,"Mostly one activity":1,"Several activities":2};
  WTPQ.forEach(function(q,qi){add("wtp_"+qi,q.t.replace(", per night","").replace(" (double room, 2 adults, breakfast)",""),"Price","0 to 4",function(r){var i=q.lab.indexOf(P(r)[q.f]);return i<0?null:i;});});
  add("prog","Programme: paid is preferred","Programme","0 to 2",function(r){var v=pr[P(r).program_type];return v==null?null:v;});
  add("geo","Programme reach: wider","Programme","0 to 2",function(r){var v=gr[P(r).geo_reach];return v==null?null:v;});
  add("cross","Programme: several activities","Programme","0 to 2",function(r){var v=cr[P(r).cross_use];return v==null?null:v;});
  [["vertical_rank","V_","What mattered most"],["mechanism_rank","M_","Mechanism"],["benefit_rank","B_","Benefit"]].forEach(function(t){
    var items={};rows.forEach(function(r){cleanRank(P(r)[t[0]]).forEach(function(x){items[x]=1;});});
    Object.keys(items).sort().forEach(function(it){add(t[1]+it,it,t[2],"0 to 1 (1 = ranked first)",function(r){return rkScore(P(r)[t[0]],it);});});});

function parseCsv(t){
  t=t.replace(/^﻿/,"");
  var first=t.split(/\r?\n/)[0],d=(first.split(";").length>=first.split(",").length)?";":",";
  var rows=[],row=[],cur="",q=false,i;
  for(i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===d){row.push(cur);cur="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(cur);cur="";if(row.length>1||row[0]!=="")rows.push(row);row=[];}
    else cur+=ch;}
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows;
}
var UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function csvToResponse(h,v,fname,who){
  var o={},errs=[];h.forEach(function(c,i){o[c.trim()]=(v[i]==null?"":v[i]).trim();});
  var sid=o.session_id;
  if(!sid)sid=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():null;
  if(!sid||!UUID_RE.test(sid))errs.push("session_id is not a valid UUID");
  var p={};
  Object.keys(o).forEach(function(k){
    var x=o[k];if(x===""||k==="created_at"||k==="session_id"||/^built_/.test(k)||k==="is_synthetic")return;
    if(k==="vertical_rank"||k==="mechanism_rank"||k==="benefit_rank"||k==="loyalty_memberships")p[k]=x.split(" > ");
    else if(k==="family_group")p[k]=x.split(", ");
    else if(k==="in_target_place")p[k]=(x==="true"||x==="TRUE");
    else if(k==="duration_s"){var n=Number(x);if(isNaN(n))errs.push("duration_s is not a number");else p[k]=n;}
    else if(k==="presented_order"){try{p[k]=JSON.parse(x);}catch(e){}}
    else p[k]=x;});
  if(o.built_enter||o.built_earn||o.built_level_up||o.built_benefits)p.program_built={enter:o.built_enter||null,earn:o.built_earn||null,level_up:o.built_level_up||null,benefits:o.built_benefits?o.built_benefits.split(" > "):[]};
  if(String(o.is_synthetic).toLowerCase()==="true")errs.push("marked is_synthetic: not importable");
  if(/^SYN-/i.test(o.session_id))errs.push("synthetic id (SYN-): not importable");
  var ca=o.created_at?new Date(o.created_at):null;if(o.created_at&&isNaN(ca))errs.push("created_at is not a valid date");
  p.import_source=fname;p.imported_at=new Date().toISOString();p.imported_by=who||"";
  return {ok:!errs.length,errs:errs,sid:sid,created_at:(ca&&!isNaN(ca))?ca.toISOString():null,destination:o.destination||null,entry_point:o.entry_point||null,payload:p};
}

        var chunk=list.slice(i,i+50).map(function(r){return {session_id:r.sid,created_at:r.created_at,destination:r.destination,entry_point:r.entry_point,payload:r.payload};});
        sb.rpc("import_responses",{p_rows:chunk,p_overwrite:ow}).then(function(x){
          if(x.error){failed+=chunk.length;qs("#im").textContent="Error: "+x.error.message;if(/function|schema cache/i.test(x.error.message))qs("#im").textContent+=" (run the import_responses SQL in Supabase first)";return;}
          done+=chunk.length;qs("#im").textContent="Imported "+done+" of "+list.length+"...";batch(i+50);});
      }
      batch(0);
    };
  };
  rd.readAsText(file,"utf-8");
}

 ["Questionnaire structure (as built)",[
  "1. Language (English or Portuguese, starting from the browser language) and a cover with an explicit consent box.",

  "5. A short animated example of how the ranking works (three neutral items, A, B and C, shown with the same cards as the real ranking). It plays once, Continue unlocks after it, and people can watch it again. Then the ranking of the holiday verticals (8, plus “Something else”): what mattered most on that visit. Milestone: “Holiday profile ready”.",
  "6. Design your loyalty programme, introduced as a way to make their holidays in Portugal the best they can be: five tasks in a fixed order, each unlocking the next. (a) Rank the 9 mechanisms. (b) Rank the 11 benefits. (c) The foundation: free, paid or free with an upgrade, the annual fee band if paid, how many activities (one only, mostly one, several) and geographic reach (local, regional, all of Portugal). The examples under each option use the person’s own top-ranked activity and chosen place. (d) Budget: hotel room and dinner per person, in bands. (e) Build the bundle: how to enter, how to earn, how to level up, and 1 benefit, the one they would most like to have.",

 ["Neutrality",[
  "Principle: the form of the questionnaire must not favour any answer.",
  "Option order is random for each person (see Randomisation) and no answer is pre-selected. Rankings start empty.",
  "All options have the same visual weight: same size, icons of the same style, no photographs and no brand or destination logos, to avoid creating associations. The only logo is the Nova SBE one on the cover.",
  "A single accent colour, a bluish slate grey. Green and red were avoided because they suggest right and wrong, and warm colours because they stimulate. The idea that cool, sober tones are more neutral comes from survey design practice and must be backed by literature before we cite it.",
  "The reach question does not name the place, and its options are generic (local, regional, all of Portugal), so people are not anchored on one destination. The place only appears in the explanation below each option.",
  "Personas: four ways of forming personas are compared with the same tests, so the team can see which one the data support. Price and programme tier is found by clustering the answers; age, entry point and travel companion are descriptive splits. Each respondent is in exactly one group. For every split, each answer (prices, programme choices, rankings of what mattered, mechanisms and benefits) is compared across the groups with the Kruskal-Wallis test, and the answers that define the split are left out so the check is not circular. Solid means it survives the correction for many tests; hint and weak do not. The table at the end shows how many more responses each group needs. Quotes and partner ideas are hypotheses written by the team, not survey results.",
  "Reading the overview: tap any card to see the same question by destination (share of each destination’s respondents, or average points for the rankings). Own reasons typed in “Something else” are left out of the points and listed in their own card, and the remaining items keep their relative order, so first place is always 8, 9 or 11 points. The answers typed in “None of these” are grouped by keyword rules (Algarve, Alentejo coast, Lisbon and Centre, North, Islands, Abroad), with the same spelling counted once; no AI is used in the panel.",
  "Scoring: respondents only see positions 1, 2, 3… In the analysis each position is converted to points in reverse. First place gets as many points as there are items (8 for the activities, 9 for the mechanisms, 11 for the benefits) and last place gets 1. The overview shows the average points per item (higher is better) and the share who ranked it first. If someone adds their own reason to the activities (9 items), their points use their own list, so first place gets 9. Respondents never see points.",
  "All three rankings ask for relevance (“from the most relevant to the least relevant”), not what the person wants. “Relevant” is used instead of “important” because it is more neutral: “important” suggests a positive judgement, while relevance only asks how much something matters to the person.",

 ["Gamification",[
  "Why: there are 20 items to rank and many definitions. A traditional questionnaire would be dense and tiring.",

 ["Randomisation",[
  "The order of options changes for each person, to avoid position effects: the first and last options tend to be chosen more often. The order is drawn once per person and stays the same if they go back.",
  "Randomised: places, main reason for the last visit, verticals, the 9 mechanisms, the 11 benefits, the options inside the programme builder, and loyalty programmes held. Questions with a natural order keep it fixed: gender, age, frequency, nights, who they travelled with (alone, couple, friends, club, family) and programme type (free, paid, upgrade).",

  "Money questions come after both rankings, so they cannot anchor the rankings. Seeing high values first tends to make people value premium benefits more.",

  "Bands are the same for every respondent, whatever place they chose, so they are not shaped by where the person went. Each season has its own bands, because January and August prices are very different. There are five bands per question, named for analysis only (the names are not shown to respondents): Mass market, Mid, High, Premium and Luxury.",
  "Bands come from Algarve market prices collected from Booking.com for 2 adults, double room, breakfast included, one night, on 30-31 January and 14-15 August (hotels), plus a restaurant dinner price list. Cut points are rounded Algarve percentiles: about the 25th (Mass market ends), 50th (Mid ends), 75th (High ends) and 90th (Premium ends); Luxury is the top 10%. January (n=124 prices): €85, €110, €150, €210. August (n=99): €190, €260, €380, €540. Dinner per person (n=162): €16, €21, €27, €40. The top row of the spreadsheet (€1,020 in three dates, €1,183 in August) is one extreme hotel and was left out, as were the spreadsheet’s summary rows. Including it moves each cut point by at most one percentile point.",
  "How answers are read: each band becomes a market percentile (the middle of the band), for example “€111 to €150” in January is about the 66th percentile. The Budget view averages this per place. A higher number than other places means respondents there accept paying more relative to the whole Algarve market, which is the premium. The market values are not shown to respondents, to avoid anchoring.",
