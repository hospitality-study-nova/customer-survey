<style>
/* Concept: a neutral travel app. White surfaces, ink text, one blue for actions and selection, grey tints for icons.
   Every option looks the same (same icon box, same size, same colour) so no answer is visually favoured.
   Layout: back chevron and title on top, thin progress, one question group per screen, full width action at the bottom. */
:root{
  color-scheme:light;
  --bg:#ffffff; --panel:#f4f5f7; --surface:#ffffff; --ink:#12151a; --muted:#5f6673; --soft:#8a919d; --line:#e1e4e9; --tint:#eef0f3;
  --accent:#3b4b56; --accent-ink:#ffffff; --accent-soft:#e8edf0; --warn:#b3321f;
  --f:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--f);letter-spacing:-.005em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 120px;min-height:100%;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.shell{max-width:520px;margin:0 auto}
svg.ic{display:block;width:100%;height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:4px 0 10px}
.bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.bar .t{text-align:center;font:700 .92rem var(--f);letter-spacing:-.01em}
.iconbtn{width:44px;height:44px;border:0;background:none;color:var(--ink);border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:10px}
.iconbtn.lg{font:800 .72rem var(--f);letter-spacing:.05em;padding:0}
.iconbtn:hover{background:var(--tint)}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:6px}
.stage .tr{height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.stage .tr i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.stage span{display:block;font:700 .6rem/1.5 var(--f);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.stage.on span{color:var(--ink)}
h1,h2{text-wrap:balance;line-height:1.12;margin:22px 0 8px;letter-spacing:-.03em}
h1{font-size:2.05rem;font-weight:800}
h2{font-size:1.6rem;font-weight:800}
h3{font:700 1.02rem/1.4 var(--f);margin:0 0 12px;letter-spacing:-.015em}
.sub{color:var(--muted);margin:0 0 4px;max-width:58ch;font-weight:500}
.q{margin:26px 0 0}
.rdemo{position:relative;margin:18px 0 4px;pointer-events:none}
.rdemo .rd-in{transition:opacity .45s,filter .45s}
.rdemo.done .rd-in{opacity:.4;filter:grayscale(1)}
.rdemo .tray{justify-content:center}
.rdemo .rlist{margin-top:10px}
.rdemo .rrow{height:56px;min-height:0;opacity:0;animation-duration:6s;animation-delay:.3s;animation-fill-mode:forwards;animation-timing-function:ease-in-out}
.rdemo .rrow.r1{animation-name:rdR1}.rdemo .rrow.r2{animation-name:rdR2,rdM2}.rdemo .rrow.r3{animation-name:rdR3,rdM3;z-index:2}
.rdemo .tok{animation:rdT1 6s .3s ease-in-out forwards}.rdemo .tok.t2{animation-name:rdT2}.rdemo .tok.t3{animation-name:rdT3}
.rdemo .nn{display:grid;flex:none}.rdemo .nn .n{grid-area:1/1}
.rdemo .nn .a{animation:rdNa 6s .3s forwards}.rdemo .nn .b{opacity:0;animation:rdNb 6s .3s forwards}.rdemo .r1 .nn .a{animation:none}
.rdemo .r3 .grip{position:relative}
.rdemo .r3 .grip::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(18,21,26,.2);opacity:0;animation:rdF 6s .3s forwards}
.rd-replay{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.14);cursor:pointer;padding:0;opacity:0;pointer-events:none;transition:opacity .3s}
.rd-replay svg{width:26px;height:26px}
.rdemo.done .rd-replay{opacity:1;pointer-events:auto}
@keyframes rdT1{0%,7%{opacity:1;transform:scale(1)}9%{transform:scale(.92)}12%{transform:scale(1);opacity:1}16%,100%{opacity:.28}}
@keyframes rdT2{0%,25%{opacity:1;transform:scale(1)}27%{transform:scale(.92)}30%{transform:scale(1);opacity:1}34%,100%{opacity:.28}}
@keyframes rdT3{0%,43%{opacity:1;transform:scale(1)}45%{transform:scale(.92)}48%{transform:scale(1);opacity:1}52%,100%{opacity:.28}}
@keyframes rdR1{0%,12%{opacity:0;transform:translateY(-8px)}20%,100%{opacity:1;transform:none}}
@keyframes rdR2{0%,30%{opacity:0;transform:translateY(-8px)}38%,100%{opacity:1;transform:none}}
@keyframes rdR3{0%,48%{opacity:0;transform:translateY(-8px)}56%,100%{opacity:1;transform:none}}
@keyframes rdM2{0%,66%{transform:none}80%,100%{transform:translateY(62px)}}
@keyframes rdM3{0%,64%{transform:none;box-shadow:none;background:var(--accent-soft)}67%{transform:none;box-shadow:0 10px 28px rgba(0,0,0,.2);background:var(--surface)}80%{transform:translateY(-62px);box-shadow:0 10px 28px rgba(0,0,0,.2);background:var(--surface)}84%,100%{transform:translateY(-62px);box-shadow:none;background:var(--accent-soft)}}
@keyframes rdF{0%,62%{opacity:0;transform:scale(.6)}67%{opacity:1;transform:scale(1)}80%{opacity:1}84%,100%{opacity:0}}
@keyframes rdNa{0%,78%{opacity:1}84%,100%{opacity:0}}
@keyframes rdNb{0%,78%{opacity:0}84%,100%{opacity:1}}
.rdemo.static .tok{animation:none;opacity:.28}.rdemo.static .rrow{animation:none;opacity:1}
.rdemo.static .r2{transform:translateY(62px)}.rdemo.static .r3{transform:translateY(-62px)}
.rdemo.static .nn .a{animation:none;opacity:0}.rdemo.static .r1 .nn .a{opacity:1}.rdemo.static .nn .b{animation:none;opacity:1}
.rdemo.static .r3 .grip::after{display:none}
.hint{color:var(--muted);font-size:.9rem;margin:-6px 0 12px}
.defbox .dh{display:block;margin-top:4px;font-size:.85rem}
.ihint{display:flex;align-items:center;gap:8px;margin:10px 0 0;color:var(--muted);font-size:.85rem;font-weight:600}
.ii{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--muted);color:var(--ink);font:700 .68rem/1 Georgia,serif;font-style:italic;vertical-align:-1px;margin:0 1px}
.vgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin:24px 0 4px;color:var(--soft);pointer-events:none;user-select:none}
.vgrid i{display:block;width:22px;height:22px;opacity:.7}.vgrid i svg{width:100%;height:100%;display:block}

.notice{margin-top:18px;background:var(--panel);border-radius:18px;padding:14px 16px;font-size:.92rem;color:var(--muted)}
.notice b{color:var(--ink)}
.defbox{display:flex;gap:12px;align-items:flex-start;margin-top:18px;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:14px 16px;font-size:.93rem}
.defbox i{flex:none;width:34px;height:34px;border-radius:11px;background:var(--surface);border:1px solid var(--line);padding:7px;color:var(--ink);display:block}
.defbox b{display:block;font-weight:700;margin-bottom:1px}
.defbox span{color:var(--muted)}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:12px;border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer}
.check .cm{display:block;margin-top:6px;font-size:.88rem;color:var(--muted)}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:none}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.chips{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.opts.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{font:inherit;font-weight:600;color:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--muted)}
.opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.row{display:flex;align-items:center;gap:12px;width:100%;border-radius:16px;padding:13px 14px;min-height:52px}
.opt.row .mark{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.opt.row.on .mark{border-color:var(--accent);background:radial-gradient(var(--accent) 0 45%,transparent 50%)}
.opt.chip{border-radius:999px;padding:10px 14px;min-height:46px;font-size:.93rem;text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.2}
.opt.tile{border-radius:18px;padding:14px;min-height:84px;display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.ti{width:36px;height:36px;border-radius:11px;background:var(--tint);color:var(--ink);padding:8px;display:block;flex:none}
.opt.on .ti{background:var(--accent);color:var(--accent-ink)}
.opt.tile b{display:block;font-weight:700;line-height:1.2}
.opt.tile small{display:block;color:var(--muted);font-size:.8rem;line-height:1.25;margin-top:2px;font-weight:500}
.opt.band{border-radius:14px;padding:12px 8px;text-align:center;font-weight:600;font-size:.92rem;min-height:56px;display:flex;align-items:center;justify-content:center}
.opt:focus-visible,.btn:focus-visible,.tok:focus-visible,.link:focus-visible,.iconbtn:focus-visible,.rb:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],textarea{width:100%;font:inherit;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
textarea{min-height:96px;resize:vertical}
.other{margin-top:10px}
.slots{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.slot{display:flex;align-items:center;gap:10px;min-height:54px;border-radius:16px;border:1.5px dashed var(--line);padding:4px 6px 4px 8px;transition:background .15s,border-color .15s}
.slot.filled{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.slot.over{border-color:var(--accent);background:var(--accent-soft)}
.slot .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--ink);display:grid;place-items:center;font:800 .85rem var(--f)}
.slot.filled .n{background:var(--accent);color:var(--accent-ink)}
.slot .ph{color:var(--soft);font-size:.88rem}
.traylabel{font:600 .86rem/1.35 var(--f);color:var(--muted);margin:20px 0 -6px}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding:12px;border-radius:18px;background:var(--panel);min-height:70px}
.tray .empty{color:var(--muted);font-size:.9rem;align-self:center;margin:0 auto}
.tok{position:relative;display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px 12px 5px 5px;font:600 .9rem var(--f);color:var(--ink);cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.tok .tl{text-align:left;line-height:1.15;min-width:0}
.tok .td{display:none;color:var(--soft);font-weight:500;font-size:.8rem;line-height:1.25}
.slot .tok{flex:1;background:transparent;border:0;padding:2px 4px 2px 0}
.slot .tok .td{display:block;margin-top:2px}
@media (min-width:470px){.slot .tok .tl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.slot .tok .td{margin:0}}
@media (hover:hover){.tray .tok:hover::after{content:attr(data-d);position:absolute;left:0;bottom:calc(100% + 8px);background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:9px;font:500 .78rem/1.3 var(--f);white-space:nowrap;z-index:40;pointer-events:none}}
.tok .info{width:24px;height:24px;font-size:.78rem;margin-left:2px}
.slot .tok .info{margin-left:auto}
details.dev{margin-top:16px;font-size:.85rem;color:var(--muted)}
details.dev summary{cursor:pointer}
.rlist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.rhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px}
.rhead .cnt{font:700 .8rem var(--f);color:var(--muted)}
.rempty{border:1.5px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--soft);font-size:.88rem}
.rlist.over .rempty{border-color:var(--accent);background:var(--accent-soft)}
.rrow{position:relative;display:flex;align-items:center;gap:8px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:16px;padding:6px 4px 6px 8px;min-height:54px}
.rrow .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 .8rem var(--f)}
.rrow .ti{width:32px;height:32px;padding:7px;background:var(--surface);color:var(--ink)}
.rrow .rt{flex:1;min-width:0;line-height:1.2}
.rrow .rt b{font-weight:700;font-size:.92rem}
.rrow .rd{display:none;color:var(--muted);font-size:.78rem;font-weight:500;margin-top:2px}
@media (min-width:470px){.rrow .rd{display:block}}
.mvs{display:flex;flex-direction:column;gap:2px;flex:none}
.mv{width:30px;height:24px;border:0;border-radius:8px;background:var(--surface);color:var(--ink);padding:5px 8px;cursor:pointer}
.mv[disabled]{opacity:.3;cursor:default}
.grip{flex:none;width:30px;height:44px;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;padding:10px 5px}
.dropbefore::before,.dropend::after{content:"";position:absolute;left:6px;right:6px;height:3px;border-radius:3px;background:var(--accent);z-index:5}
.dropbefore::before{top:-5px}
.dropend::after{bottom:-5px}
.rrow.ghost{box-shadow:0 10px 28px rgba(0,0,0,.2);background:var(--surface)}
.ghost{position:fixed;z-index:100;pointer-events:none;box-shadow:0 10px 28px rgba(0,0,0,.2);transform:scale(1.03);opacity:.97}
.ghost::after{display:none!important}
.link{background:none;border:0;color:var(--accent);font:700 .92rem var(--f);cursor:pointer;padding:8px 0}
.deckhead{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font:700 .72rem var(--f);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.dots{display:flex;gap:4px;margin:8px 0 14px}
.dots i{flex:1;height:3px;border-radius:9px;background:var(--line)}
.dots i.d{background:var(--muted)}
.dots i.c{background:var(--accent)}
.big{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 20px 18px;animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.big .bi{width:56px;height:56px;border-radius:18px;background:var(--tint);color:var(--ink);padding:14px;margin-bottom:16px}
.big h2{margin:0 0 6px;font-size:1.4rem}
.big .ex{font-size:1rem;margin:0 0 6px}
.big .def{margin:8px 0 0;padding:12px 14px;border-radius:14px;background:var(--panel);font-size:.88rem;color:var(--muted)}
.big .def b{color:var(--ink)}
.react{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.rb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .84rem/1.2 var(--f);text-align:center;cursor:pointer;min-height:76px}
.rb i{width:22px;height:22px;display:block}
.rb:hover{border-color:var(--muted)}
.rb.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.it{border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:10px;background:var(--surface)}
.it .hd{display:flex;align-items:center;gap:12px}
.it .hd .ti{background:var(--tint);color:var(--ink)}
.it .tx{flex:1;min-width:0}
.it .tx b{display:block;font-weight:700;line-height:1.2}
.it .tx span{display:block;color:var(--muted);font-size:.84rem;line-height:1.3;font-weight:500}
.info{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:700 .9rem/1 Georgia,serif;font-style:italic;cursor:pointer;display:grid;place-items:center}
.info:hover{border-color:var(--muted);color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.sg{padding:9px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .8rem/1.2 var(--f);cursor:pointer;text-align:center}
.sg:hover{border-color:var(--muted)}
.sg.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--bg);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:rise .2s ease-out}
.sheet h2{margin:0 0 4px;font-size:1.3rem}
.sheet .lab{font:700 .66rem var(--f);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.sheet p{margin:0}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:24px}}
.bs{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.bs:hover{border-color:var(--muted)}
.bs.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.bs .ti{background:var(--tint)}
.bs.on .ti{background:var(--accent);color:var(--accent-ink)}
.bs .tx{flex:1;min-width:0}
.bs small{display:block;font:700 .64rem var(--f);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.bs b{display:block;font-weight:700;line-height:1.25;margin-top:1px}
.bs .sd{display:block;color:var(--muted);font-size:.82rem;font-weight:500;line-height:1.3}
.bs .ch{flex:none;width:20px;height:20px;color:var(--muted)}

.hubp{height:6px;border-radius:99px;background:var(--line);margin:18px 0 6px;overflow:hidden}.hubp i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease}
.hubn{font:600 .8rem var(--f);color:var(--muted);margin:0 0 4px}
.tg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:10px}
.task{min-width:0;box-sizing:border-box;display:flex;flex-direction:column;align-items:flex-start;gap:10px;width:100%;padding:14px;border-radius:22px;gap:8px;border:1px solid var(--line);background:var(--tint);color:var(--muted);font:inherit;text-align:left;cursor:pointer;transition:transform .15s ease,border-color .15s}

he program.", "exs": ["A discount with an airline or a car rental company", "Offers in local restaurants and experiences from partner companies"], "vs": ""}, "flex": {"more": "Flexibility when booking and paying, like the ability to combine cash and points. It removes money barriers to booking, such as paying later.", "exs": ["Book now and pay later", "Pay for a stay with part cash and part points"], "vs": ""}, "ai": {"more": "Artificial intelligence that suggests activities and recommends services. It helps you plan and decide by finding options and answering your questions.", "exs": ["An app that builds your itinerary for you", "A chat that suggests restaurants and books a table"], "vs": ""}, "esg": {"more": "Donating to a local community or an environmental cause. You can turn part of your value into positive impact, or be rewarded for making sustainable choices.", "exs": ["Donate part of your points to a local cause", "A reward for choosing a greener option"], "vs": ""}, "service": {"more": "Services such as priority reservations or a dedicated concierge. It is personal and priority service that regular guests do not get, and it is about how you are looked after.", "exs": ["A dedicated concierge", "A table at a restaurant that is fully booked", "Preferred tee times at the golf course", "A priority phone line"], "vs": "Exclusive experiences and spaces, which is about events and places reserved for members. A simple way to remember: services are how you are looked after, experiences and spaces are where you can go and what you can attend."}};

var ENO={},ENOn=0;
function trs(str){
  if(S.lang!=="pt"){if(!ENOn)return str;var t0=String(str).trim();if(!t0||!ENO.hasOwnProperty(t0))return str;return str.match(/^\s*/)[0]+ENO[t0]+str.match(/\s*$/)[0];}
  var t=String(str).trim();if(!t)return str;
  var lead=str.match(/^\s*/)[0],trail=str.match(/\s*$/)[0];
  var r=PTD.hasOwnProperty(t)?PTD[t]:undefined;
  if(r===undefined){for(var i=0;i<PATS.length;i++){if(PATS[i][0].test(t)){r=t.replace(PATS[i][0],PATS[i][1]);break;}}}
  if(r===undefined){if(/[A-Za-z]{3,}/.test(t)&&!EXEMPT[t]&&MISS.indexOf(t)<0)MISS.push(t);return str;}
  return lead+r+trail;
}
function trDom(root){
  if(S.lang!=="pt"&&!ENOn)return;
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n,nodes=[];
  while((n=w.nextNode()))nodes.push(n);
  nodes.forEach(function(n){var p=n.parentNode&&n.parentNode.nodeName;if(p==="PRE"||p==="TEXTAREA"||p==="SCRIPT"||p==="STYLE")return;var v=trs(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;});
  var els=root.querySelectorAll("[placeholder],[aria-label],[data-d]");
  for(var i=0;i<els.length;i++){["placeholder","aria-label","data-d"].forEach(function(a){if(els[i].hasAttribute(a))els[i].setAttribute(a,trs(els[i].getAttribute(a)));});}
}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function byKey(list,k){for(var i=0;i<list.length;i++){if(list[i].k===k)return list[i];}return null;}
function nameOf(list,k){var o=byKey(list,k);return o?o.l:k;}
function ordered(key,list){
  var ks=list.map(function(x){return x.k;});var o=S.order[key];
  var ok=o&&o.length===ks.length&&ks.every(function(k){return o.indexOf(k)>-1;});
  if(!ok){S.order[key]=shuffle(ks);}
  return S.order[key].map(function(k){return byKey(list,k);});
}

function rankVals(rk){

function addTo(rk,k,idx){

var drag=null;
function dropIndex(rk,y,skipK){
  var rows=document.querySelectorAll('.rlist[data-rlist="'+rk+'"] .rrow');var idx=0,cnt=0;
  for(var i=0;i<rows.length;i++){if(rows[i].getAttribute("data-k")===skipK)continue;var r=rows[i].getBoundingClientRect();if(y>r.top+r.height/2)idx=cnt+1;cnt++;}

function clearMarks(){var els=document.querySelectorAll(".dropbefore,.dropend,.rlist.over");for(var i=0;i<els.length;i++){els[i].classList.remove("dropbefore","dropend","over");}}
function markDrop(d,y){
  clearMarks();var list=document.querySelector('.rlist[data-rlist="'+d.rk+'"]');if(!list)return null;
  var r=list.getBoundingClientRect();if(y<r.top-30||y>r.bottom+30)return null;
  var idx=dropIndex(d.rk,y,d.src==="row"?d.k:null);
  var rows=[].filter.call(list.querySelectorAll(".rrow"),function(e){return e.getAttribute("data-k")!==(d.src==="row"?d.k:null);});
  if(rows.length===0)list.classList.add("over");else if(idx<rows.length)rows[idx].classList.add("dropbefore");else rows[rows.length-1].classList.add("dropend");
  return idx;
}
document.addEventListener("pointerdown",function(e){
  if(e.target.closest&&e.target.closest(".info"))return;
  if(e.button&&e.button>0)return;
  var g=e.target.closest&&e.target.closest(".grip");var t=g?g.closest(".rrow"):(e.target.closest&&e.target.closest(".tok"));
  if(!t)return;
  drag={el:t,src:g?"row":"opt",rk:t.getAttribute("data-rk"),k:t.getAttribute("data-k"),x:e.clientX,y:e.clientY,moved:false,ghost:null};
  if(g&&e.cancelable)e.preventDefault();
});
document.addEventListener("pointermove",function(e){
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){
    drag.moved=true;var r=drag.el.getBoundingClientRect();var gh=drag.el.cloneNode(true);gh.classList.add("ghost");gh.style.width=r.width+"px";gh.style.left=r.left+"px";gh.style.top=r.top+"px";
    document.body.appendChild(gh);drag.ghost=gh;drag.dx=e.clientX-r.left;drag.dy=e.clientY-r.top;drag.el.style.opacity=".35";
  }
  if(drag.moved){
    drag.ghost.style.left=(e.clientX-drag.dx)+"px";drag.ghost.style.top=(e.clientY-drag.dy)+"px";
    drag.idx=markDrop(drag,e.clientY);
    if(e.cancelable)e.preventDefault();
    var vh=window.innerHeight;drag.sy=e.clientY<130?-14:(e.clientY>vh-120?14:0);
    if(drag.sy&&!drag.raf){var step=function(){if(!drag||!drag.sy){if(drag)drag.raf=0;return;}window.scrollBy(0,drag.sy);drag.raf=requestAnimationFrame(step);};drag.raf=requestAnimationFrame(step);}
  }
});
function endDrag(e,cancel){
  if(!drag)return;var d=drag;drag=null;d.sy=0;
  if(d.ghost)d.ghost.remove();clearMarks();
  if(!d.moved){if(!cancel&&d.src==="opt"){addTo(d.rk,d.k,null);render(true);}return;}
  d.el.style.opacity="";
  if(cancel)return;
  var idx=markDrop(d,e.clientY);clearMarks();
  if(idx!=null){addTo(d.rk,d.k,idx);}
  render(true);
}
document.addEventListener("pointerup",function(e){endDrag(e,false);});

 {id:"about",stage:0,

 {id:"m1",stage:1,ms:true,hideNav:true,nav:"Continue",

 {id:"places",stage:1,

 {id:"otherplace",stage:1,skip:function(){return A.dest!=="none";},

 {id:"trip",stage:1,

 {id:"reason",stage:1,

   var dev=S.sub==="preview"?'<details class="dev"><summary>Test mode: nothing was sent. See what would be saved</summary><pre>'+esc(JSON.stringify(S.preview,null,2))+'</pre></details>':'';

  valid:function(){return true;}}
];
var END={html:function(){

  return '<h1>Thank you</h1><p class="sub">This study is about holidays in the places we asked about, so we cannot continue. We appreciate your time and your answer.</p>';}};

var main=document.getElementById("main"),nav=document.getElementById("nav"),bBack=document.getElementById("back"),bNext=document.getElementById("next"),stg=document.getElementById("stages");

var moreEl=null;

  }

function render(keepScroll){
  var y=window.pageYOffset;var st=S.end?END:stepById(S.cur);

  main.innerHTML=st.html()+(st.raw?"":modalHTML());

  if(!keepScroll){for(var ci=0;ci<main.children.length;ci++)main.children[ci].style.setProperty("--i",Math.min(ci,9)+(S.fromLang?5:0));}
  var stc=main.querySelectorAll(".stamp");for(var si=0;si<stc.length;si++)stc[si].style.setProperty("--n",si);
  if(!st.raw)trDom(main);

  clearTimeout(S.msT);if(st.ms&&!S.end&&S.langOk){var cur=S.cur;S.msT=setTimeout(function(){if(S.cur===cur&&!S.end)go(1);},1800);}
  S.fromLang=false;
  if(keepScroll)window.scrollTo(0,y);
  S.pop=null;

}
function updateNav(){
  var v=vis();var st=S.end?END:stepById(S.cur);var idx=v.findIndex(function(s){return s.id===S.cur;});
  var hide=S.end||st.hideNav;nav.hidden=!!hide;
  bBack.style.visibility=(S.end||idx>0)?"visible":"hidden";
  var T1=(!S.end&&st.task)?taskOf(st.id):null;var lastInTask=T1&&T1.steps.indexOf(st.id)===T1.steps.length-1;bNext.textContent=st.raw?st.nav:trs(lastInTask?"Done":(st.nav||"Next"));
  if(!S.end&&st.id==="hub"){var nt2=null;TASKS.forEach(function(t){if(!nt2&&!S.done[t.k])nt2=t;});bNext.textContent=nt2?trs(doneCount()?"Continue":"Start")+": "+trs(nt2.l):trs("Finish");}bNext.disabled=!S.langOk||!(st.valid&&st.valid());
  var cs=S.end?-1:st.stage;if(!S.end&&st.id==="hub")cs=!(S.done.feat&&S.done.ben)?2:(!(S.done.det&&S.done.pay)?3:4);
  var html="";var newPct=[];
  for(var s=0;s<STAGES.length;s++){
    var inS=v.filter(function(x){return x.stage===s;});var pos=inS.findIndex(function(x){return x.id===S.cur;});
    var pct=cs>s?100:(cs===s?Math.round((pos+1)/inS.length*100):0);
    if(s>=2){var fin=S.cur==="pass";var D=function(k){return S.done[k]?1:0;};
      pct=fin?100:(s===2?(D("feat")+D("ben"))*50:(s===3?(D("det")+D("pay"))*50:D("build")*100));}
    if(S.end)pct=0;newPct.push(pct);
    html+='<div class="stage'+(cs===s?' on':'')+'"><div class="tr"><i style="width:'+(S.pct[s]||0)+'%"></i></div><span>'+esc(trs(STAGES[s]))+'</span></div>';
  }
  stg.innerHTML=html;
  var bars=stg.querySelectorAll('.tr i');
  requestAnimationFrame(function(){requestAnimationFrame(function(){for(var b=0;b<bars.length;b++)bars[b].style.width=newPct[b]+'%';});});
  S.pct=newPct;
}
function burst(){
  try{if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;}catch(e){}
  var cols=["#3b4b56","#12151a","#9aa3b0","#8197a6","#d5dae2"];var n=26;

    document.body.appendChild(e);(function(el){setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},2800);})(e);}

function enter(id,dir){
  S.cur=id;S.bst=false;var st=stepById(id);
  if(st&&st.deck&&dir!==0){S.deck[st.deck]=dir>0?0:DECKS[st.deck].items.length-1;}
  if(id==="pass")S.sub=null;
  if(id==="rank"&&A.rankSeed!==A.entry){A.rankSeed=A.entry;A.rank=(A.entry&&A.entry!=="other")?[A.entry]:[];}
}
function go(dir){
  if(S.cur==="hub"&&dir>0){var nt=null;TASKS.forEach(function(t){if(!nt&&!S.done[t.k])nt=t;});enter(nt?nt.steps[0]:"open",1);render();window.scrollTo(0,0);return;}
  if(S.cur==="open"){if(dir>0){S.done.own=true;enter("pass",1);}else enter("hub",-1);render();window.scrollTo(0,0);return;}
  var st0=stepById(S.cur);var T0=st0&&st0.task?taskOf(S.cur):null;
  if(T0){var ti=T0.steps.indexOf(S.cur);
    if(dir>0){if(!st0.valid())return;if(st0.onNext)st0.onNext();
      if(ti<T0.steps.length-1)enter(T0.steps[ti+1],1);else{S.done[T0.k]=true;S.justDone=T0.k;enter("hub",1);}}
    else{if(ti>0)enter(T0.steps[ti-1],-1);else enter("hub",-1);}
    render();window.scrollTo(0,0);return;}
  var v=vis();var idx=v.findIndex(function(s){return s.id===S.cur;});
  if(dir>0){
    var st=stepById(S.cur);if(!st.valid())return;
    if(st.onNext)st.onNext();
    if(S.end){render();window.scrollTo(0,0);return;}
    v=vis();idx=v.findIndex(function(s){return s.id===S.cur;});
    enter(v[idx+1].id,1);
  }else if(idx>0){var tb=idx-1;while(tb>0&&v[tb].ms)tb--;enter(v[tb].id,-1);}
  render();window.scrollTo(0,0);
}
bNext.addEventListener("click",function(){go(1);});
bBack.addEventListener("click",function(){
  if(S.end){S.end=null;render();window.scrollTo(0,0);return;}
  var st=stepById(S.cur);if(st&&st.deck&&S.deck[st.deck]>0){S.deck[st.deck]--;render();window.scrollTo(0,0);}else{go(-1);}
});

document.addEventListener("click",function(e){
  var t=e.target;
  if(!S.end&&S.langOk&&stepById(S.cur)&&stepById(S.cur).ms&&t.closest&&t.closest("#main")){clearTimeout(S.msT);go(1);return;}
  if(t.id==="retry"){S.sub=null;render();return;}

  if(tk){var TT=taskById(tk.getAttribute("data-task"));enter(TT.steps[0],1);render();window.scrollTo(0,0);return;}
  if(t.closest&&t.closest("#finish")){if(reqDone()){enter("open",1);render();window.scrollTo(0,0);}return;}
  if(t.closest&&t.closest("#share")){shareIt();return;}
  if(t.closest&&t.closest("#wa")){waShare();return;}
  if(t.closest&&t.closest("#cp")){copyLink();return;}
  var lgb=t.closest&&t.closest("[data-lang]");
  if(lgb){S.lang=lgb.getAttribute("data-lang");
    if(!S.langOk){S.langOk=true;S.fromLang=true;lgb.classList.add("on");var sc=document.getElementById("lscrim");if(sc)sc.classList.add("leave");render(false);window.scrollTo(0,0);
      setTimeout(function(){var z=document.getElementById("lscrim");if(z&&z.parentNode)z.parentNode.removeChild(z);moreUpdate();},430);return;}
    render(true);return;}
  if(t.id==="lg"){S.lang=S.lang==="pt"?"en":"pt";render(true);return;}

  if(cl&&(cl.className==="btn primary"||t===cl)){if(S.info){S.info=null;}else{S.pick=null;}render(true);return;}
  var sd=t.closest&&t.closest("[data-slot]");
  if(sd){S.pick=sd.getAttribute("data-slot");render(true);return;}
  var pkb=t.closest&&t.closest("[data-pick]");
  if(pkb&&pkb.classList.contains("dis"))return;
  if(pkb){A.build=A.build||{};var v=pkb.getAttribute("data-pick");
    if(v==="__none"&&BSLOTS.indexOf(S.pick)>-1){delete A.build[S.pick];}else{A.build[S.pick]=v;}
    if(BSLOTS.indexOf(S.pick)>-1){var bb=A.build;var arr=BSLOTS.map(function(x){return bb[x];}).filter(Boolean);BSLOTS.forEach(function(x,i){if(arr[i])bb[x]=arr[i];else delete bb[x];});}
    S.pop="slot:"+S.pick;buzz();S.pick=null;render(true);return;}
  var inf=t.closest&&t.closest("[data-info]");
  if(inf){S.info=inf.getAttribute("data-info");render(true);return;}

  var b=t.closest&&t.closest(".opt");if(!b)return;
  var box=b.closest(".opts");var key=box.getAttribute("data-q"),type=box.getAttribute("data-type"),v=b.getAttribute("data-v");
  S.pop=key+":"+v;buzz();

  else{
    var c=(A[key]||[]).slice();
    if(c.indexOf(v)>-1){c=c.filter(function(x){return x!==v;});}
    else if(b.getAttribute("data-excl")){c=[v];}
    else{c=c.filter(function(x){var el=box.querySelector('[data-v="'+x+'"]');return !(el&&el.getAttribute("data-excl"));}).concat(v);}
    A[key]=c;
  }

function nextQ(key){
  setTimeout(function(){
    var bx=main.querySelector('[data-q="'+key+'"]');if(!bx)return;var sec=bx.closest(".q");if(!sec)return;
    var n=sec.nextElementSibling;while(n&&!(n.classList&&n.classList.contains("q")&&!n.querySelector(".opt.on")))n=n.nextElementSibling;

document.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.getAttribute&&e.target.getAttribute("data-info")){e.preventDefault();S.info=e.target.getAttribute("data-info");render(true);return;}

function reactNamed(dk,list){var o={};list.forEach(function(x){o[x.l]=A.react[dk][x.k]?RXN[A.react[dk][x.k]]:null;});return o;}

   duration_s:Math.round((Date.now()-S.t0)/1000),language:S.lang,gender:A.gender||null,age:A.age,residence:A.res,destination:inScope?A.dest:null,other_destination:inScope?null:(A.otherDest||null),in_target_place:!!inScope,
   no_holiday_last_3y:inScope?null:!!A.noHol,

   entry_point:A.entry?(A.entry==="other"?"other":nameOf(VERTS,A.entry)):null,entry_point_other:A.entry==="other"?A.entryOther:null,

/* Saves with a database function (upsert on session_id), so going back and changing an answer updates the same row. */
function send(p,cb){
  if(TEST||!CONFIG.SUPABASE_URL){cb("preview");return;}
  fetch(CONFIG.SUPABASE_URL+"/rest/v1/rpc/"+CONFIG.RPC,{method:"POST",
    headers:{apikey:CONFIG.SUPABASE_ANON_KEY,Authorization:(/^eyJ/.test(CONFIG.SUPABASE_ANON_KEY)?"Bearer "+CONFIG.SUPABASE_ANON_KEY:undefined),"Content-Type":"application/json"},
    body:JSON.stringify({p_session:S.sid,p_destination:p.destination,p_entry:p.entry_point,p_payload:p})})
  .then(function(r){cb(r.ok?"saved":"error");}).catch(function(){cb("error");});
}
function shareUrl(){return CONFIG.SHARE_URL||location.href.split("#")[0];}
function shareTxt(){return S.lang==="pt"?"Estudo de estudantes da Nova SBE sobre férias em Portugal. Demora cerca de 5 minutos e é anónimo:":"A Nova SBE student study about holidays in Portugal. It takes about 5 minutes and is anonymous:";}
function copyLink(){
  var url=shareUrl();
  function copied(){S.copied=true;render(true);setTimeout(function(){S.copied=false;if(S.cur==="pass")render(true);},2200);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(copied,function(){});return;}
  var ta=document.createElement("textarea");ta.value=url;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");copied();}catch(e){}document.body.removeChild(ta);
}
function shareIt(){
  var data={title:S.lang==="pt"?"Férias em Portugal":"Holidays in Portugal",text:shareTxt(),url:shareUrl()};
  if(navigator.share){navigator.share(data).catch(function(){});return;}
  copyLink();
}
function waShare(){window.open("https://wa.me/?text="+encodeURIComponent(shareTxt()+" "+shareUrl()),"_blank");}
function submit(){
  S.sub="sending";var p=payload();
  if(TEST||!CONFIG.SUPABASE_URL){S.sub="preview";S.preview=p;render();return;}
  render();
  send(p,function(res){S.sub=res;if(S.cur==="pass"&&!S.end)render();});
}
render();loadOverrides();
